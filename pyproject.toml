[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cami"
version = "0.1.0"
description = "Change-aware maintenance of fixed repository memory cohorts"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.5", "numpy==2.2.6", "matplotlib==3.10.8"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.10", "mypy==1.19.1"]
llm = ["openai==2.15.0"]

[project.scripts]
cami = "cami.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "scripts/build_submission.py",
    "output/**",
    "examples/ai_review_pilot/packet/source/**",
    "examples/real_structural_replay/parent_sources/**",
    "reports/research-20261104/ai-parent-pilot-v1/reviewer_*/**",
    "reports/research-20261104/reference-alignment-*/sources/**",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: executes prepared Docker images"]

[tool.hatch.build.targets.wheel]
packages = ["src/cami"]
exclude = ["src/cami/_typescript/node_modules/**"]
